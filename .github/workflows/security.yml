name: Security

# WHERE THIS WORKS — read before forking into a private repo.
#
# `gitleaks` works anywhere: it runs the scanner itself and fails the job on a
# finding, independent of any GitHub feature or plan. Its job grants `pull-requests:
# read` (the action lists a PR's commits through the API), which a private repo
# needs. (One caveat: the action asks for a GITLEAKS_LICENSE when the repo is owned
# by an ORGANISATION; a personal account needs nothing.)
#
# `codeql` needs GitHub **code scanning** enabled, which is free on PUBLIC repos
# and a paid add-on on private ones. This repository is public, so it works as
# written. In a PRIVATE fork the analyze step fails when it tries to upload
# results, and the API says so plainly:
#   "Code scanning is not enabled for this repository." (HTTP 403)
# A private fork therefore has to either enable Advanced Security for the repo, or
# delete the `codeql` job below and keep `gitleaks`. Do not "fix" a red CodeQL job
# by weakening the workflow — it is a plan boundary, not a configuration mistake.
#
# `zizmor` also works anywhere: it audits only this repository's workflow files (unpinned actions, credentials
# left in the checkout, injectable expressions). Its online audits query the GitHub API about the actions the
# workflows reference, with the job's own read-only token, so it needs no extra permission or plan.

on:
    pull_request:
        branches: [main, master]
    push:
        branches: [main, master]
    schedule:
        # Sunday 06:00 UTC — weekly catch-up scan picks up CVEs published mid-week.
        - cron: '0 6 * * 0'

# Read-only floor for the whole workflow; each job below declares its own scopes, which replace it.
permissions:
    contents: read

# Avoid duplicate runs when a branch push triggers a PR.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
    gitleaks:
        name: Secret scan (gitleaks)
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # On a pull_request the action lists the PR's commits through the pulls API; without
            # this scope the job fails 403 in a private repository (a job-level block replaces the
            # workflow floor).
            pull-requests: read
        steps:
            - name: Checkout (full history)
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # gitleaks needs commit history to scan past commits, not just HEAD.
                  fetch-depth: 0
                  persist-credentials: false

            - name: Run gitleaks
              # SHA-pinned — tags are mutable and have been retargeted in supply-chain
              # attacks (tj-actions, 2025); Dependabot's github-actions ecosystem keeps
              # this fresh.
              uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # Fail the job on any finding (default already, but explicit).
                  GITLEAKS_EXIT_CODE: 1

    codeql:
        name: CodeQL (JavaScript / TypeScript)
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
            security-events: write
        strategy:
            fail-fast: false
            matrix:
                language: [javascript-typescript]
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Initialize CodeQL
              uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
              with:
                  languages: ${{ matrix.language }}
                  # Adds the security-extended pack — broader coverage at the cost of run time.
                  # Drop to default if CodeQL becomes a bottleneck.
                  queries: security-extended
                  # Excludes the generated MSW worker, with the reason in the file.
                  config-file: ./.github/codeql/codeql-config.yml

            - name: Perform analysis
              uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
              with:
                  category: '/language:${{ matrix.language }}'

    zizmor:
        name: Workflow audit (zizmor)
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # Nothing in this job pushes, so the token must not outlive the checkout.
                  persist-credentials: false

            - name: Audit workflows
              # The action runs zizmor from a container image pinned by digest; `version` selects that pin and is
              # an exact release on purpose. Dependabot moves the action's SHA; a newer zizmor is a deliberate edit
              # of `version`, so a new audit rule reddens the pull request that bumps it, not a random weekly run.
              # The same pin and config reproduce this verdict locally: `uvx zizmor@1.30.1 .github/workflows`.
              uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
              with:
                  version: 1.30.1
                  inputs: .github/workflows
                  config: .github/zizmor.yml
                  # Fail on medium and above; `.github/zizmor.yml` lifts the one finding the online run grades lower.
                  min-severity: medium
                  # Annotations on the run instead of a SARIF upload, which would need `security-events: write`.
                  advanced-security: false
                  annotations: true
