version: 2
updates:
    - package-ecosystem: npm
      directory: '/'
      schedule:
          interval: weekly
      open-pull-requests-limit: 10
      commit-message:
          prefix: chore(deps)
      # Dependency cooldown: let fresh releases soak before PRs are opened
      # (supply-chain worm waves 2025-2026 were typically remediated within days).
      cooldown:
          default-days: 7
          semver-major-days: 14
      # One weekly PR for every minor and patch update, production and development alike: two groups
      # both rewrite package-lock.json, so the second one conflicted after the first merged (2026-09-27).
      # A major update still arrives as its own PR, where it gets its own look.
      groups:
          minor-and-patch:
              update-types: ['minor', 'patch']
      # Every ignore below mirrors an entry in scripts/version-holds.json, which holds the reason
      # and the lift condition; `npm run verify` (check-version-holds) fails when the two disagree.
      # An ignore that outlives its reason silently withholds security patches: re-check the
      # reason before adding or keeping one.
      ignore:
          - dependency-name: typescript
            versions: ['>=6.1']
          - dependency-name: eslint
            versions: ['>=11']
          - dependency-name: '@eslint/js'
            versions: ['>=11']
          - dependency-name: '@types/node'
            versions: ['>=25']
          - dependency-name: vitest
            versions: ['>=5']
          - dependency-name: '@vitest/coverage-v8'
            versions: ['>=5']
          - dependency-name: msw
            versions: ['>=3']

    - package-ecosystem: github-actions
      directory: '/'
      schedule:
          interval: weekly
      commit-message:
          prefix: ci(deps)
      groups:
          actions:
              patterns: ['*']
